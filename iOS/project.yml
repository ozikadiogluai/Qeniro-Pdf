# Qeniro PDF — iPhone (iOS 17+) projesi. XcodeGen ile üretilir:  ./build-ios.sh
# macOS projesinden (../project.yml) bağımsızdır; platformdan bağımsız servis dosyaları
# ../QeniroPDF altından doğrudan paylaşılır.
name: QeniroPDFiOS
options:
  bundleIdPrefix: com.qeniro
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: tr
  createIntermediateGroups: true
# PDFium (gerçek metin düzenleme). build-ios.sh kitaplığı indirince QPDF_PDFIUM=true verir.
# Ortam değişkeni yoksa PDFium'suz (yedek yol) derlenir.
include:
  - path: pdfium.yml
    enable: ${QPDF_PDFIUM}
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  QeniroPDFiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: QeniroPDFiOS
      # macOS uygulamasıyla paylaşılan, platformdan bağımsız dosyalar
      - path: ../QeniroPDF/Services/ZipWriter.swift
        group: Shared
      - path: ../QeniroPDF/Services/OfficeExportService.swift
        group: Shared
      - path: ../QeniroPDF/Services/PDFOCRService.swift
        group: Shared
      - path: ../QeniroPDF/Utilities/Formatters.swift
        group: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qeniro.pdf.ios
        PRODUCT_NAME: Qeniro PDF
        PRODUCT_MODULE_NAME: QeniroPDFiOS
        INFOPLIST_FILE: QeniroPDFiOS/Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
schemes:
  QeniroPDFiOS:
    build:
      targets:
        QeniroPDFiOS: all
    run:
      config: Debug
    archive:
      config: Release
